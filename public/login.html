<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c0b"><title>WebGit — Private Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="login-shell"><section class="login-card"><div class="login-brand"><span class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 7 3.5 12 8 17M16 7l4.5 5-4.5 5M14 4l-4 16"/></svg></span><span class="login-brand-name">webgit <span>/ private access</span></span></div><div class="login-eyebrow">PRIVATE DEPLOYMENT WORKSPACE</div><h1 class="login-title">Welcome <span>back.</span></h1><p class="login-copy">Masukkan password untuk membuka WebGit dan mengakses repository GitHub.</p><form id="form"><label class="login-label" for="password">Workspace password</label><div class="login-input-row"><input class="login-input" id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" required><button class="login-show" id="show" type="button">Show</button></div><div id="error" class="login-error" role="alert"></div><button id="submit" class="login-submit" type="submit">Unlock workspace <span>↗</span></button></form><div class="login-security">Password is verified securely on the server</div></section><div class="login-footer">WEBGIT / DEPLOY CONSOLE</div></main>
<script>
const form=document.getElementById("form"),input=document.getElementById("password"),error=document.getElementById("error"),submit=document.getElementById("submit");
document.getElementById("show").addEventListener("click",()=>{input.type=input.type==="password"?"text":"password";document.getElementById("show").textContent=input.type==="password"?"Show":"Hide"});
form.addEventListener("submit",async e=>{
e.preventDefault();error.classList.remove("show");error.textContent="";
submit.disabled=true;submit.textContent="Checking access…";
try{
const response=await fetch("/api/auth-check",{method:"POST",headers:{"x-deploy-key":input.value.trim()}});
const data=await response.json().catch(()=>({}));
if(!response.ok||!data.ok)throw new Error(data.error||"Password salah.");
sessionStorage.setItem("webgit_access_key",input.value.trim());
location.replace("/dashboard.html");
}catch(err){error.textContent=err.message.includes("Password WebGit salah")?"Password salah. Coba periksa kembali.":err.message;error.classList.add("show");input.select()}
finally{submit.disabled=false;submit.textContent="Unlock workspace ↗"}
});
</script>
</body></html>
